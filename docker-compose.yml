# version: '3.9'

services:
  # PostgreSQL Database
  # db:
  #   image: postgres:15-alpine
  #   container_name: portfolio-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-portfolio_db}
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - portfolio-network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
      args:
        BACKEND_DIR: backend
        FRONTEND_DIR: frontend
        VITE_BACKEND_ORIGIN: ${VITE_BACKEND_ORIGIN:-https://carlosjportfolio.com}
        # VITE_BACKEND_ORIGIN: ${VITE_BACKEND_ORIGIN:-http://localhost:8000}
    container_name: portfolio-backend
    restart: unless-stopped
    # Production WSGI server. Never use `manage.py runserver` here: it is
    # single-threaded and explicitly unsupported for production traffic.
    # Migrations and collectstatic are handled by deploy.sh, not on boot,
    # so a failure there cannot leave the container crash-looping.
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers 3 --threads 2
      --worker-class gthread --worker-tmp-dir /dev/shm
      --access-logfile - --error-logfile -
      backend_config.wsgi:application
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
      # - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
      # - backend_static:/app/staticfiles
      # - backend_media:/app/media

    # environment:
    #   - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    #   - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    #   - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    #   - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS}
    #   - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    #   - VITE_BACKEND_ORIGIN=${VITE_BACKEND_ORIGIN}
    #   - OPENAI_API_KEY=${OPENAI_API_KEY}

    environment:
      # Default to production-safe values. Set DJANGO_DEBUG=True in .env for
      # local work. DJANGO_SECRET_KEY is passed through empty rather than
      # falling back to a hardcoded key: settings.py generates a throwaway key
      # when DEBUG is on and refuses to boot without one when DEBUG is off.
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - VITE_BACKEND_ORIGIN=${VITE_BACKEND_ORIGIN:-http://localhost:8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - portfolio-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: portfolio-frontend
    restart: unless-stopped
    command: npm run dev
    # This is the Vite dev server and is for local development only -- in
    # production the SPA is served by Django from backend/frontend_dist.
    # Bound to localhost so it is never reachable from the internet.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_BACKEND_ORIGIN=${VITE_BACKEND_ORIGIN:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - portfolio-network

  # Nginx Reverse Proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network
    profiles:
      - production

networks:
  portfolio-network:
    driver: bridge

volumes:
  # postgres_data:
  backend_static:
  backend_media: